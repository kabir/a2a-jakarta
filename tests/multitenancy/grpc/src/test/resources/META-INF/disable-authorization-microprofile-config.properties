a2a.authorization.required=false
# Read by MultiTenantAgentCardProducer (a2a-java-extras-multitenancy-tests-test-common) to build
# the card's transport URL. For a GRPC-preferred card this doubles as the gRPC target port, so it
# must be WildFly's actual gRPC subsystem port (9555), not the HTTP port (8080) — matching this
# project's existing tests/grpc convention of pointing its AgentCardProducer at the gRPC port via
# -Dtest.agent.card.port=9555.
quarkus.http.port=9555
