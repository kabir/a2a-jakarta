a2a.authorization.required=false
# Skip transport validation — this JSON-RPC deployment does not include the HTTP_JSON transport the shared card advertises
org.a2aproject.sdk.transport.skipValidation=true
# Read by MultiTenantAgentCardProducer (a2a-java-extras-multitenancy-tests-test-common) to build
# the card's transport URL. Despite the name this is a generic MicroProfile Config lookup, not a
# Quarkus-only mechanism — WildFly's HTTP port here is 8080.
quarkus.http.port=8080
